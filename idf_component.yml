# Time Manager Component Manifest
version: "0.1.0"
description: "A lightweight, dependency-injected C++ time management and SNTP synchronization library for ESP-IDF."
maintainers:
  - "Aluizio Tomazelli <aluiziotomazelli@gmail.com>"

license: "MIT"

tags:
  - time
  - sntp
  - ntp
  - epoch
  - clock
  - esp-now
  - esp32
  - cpp

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - linux

dependencies:
  idf: ">=5.1"

files:
  use_gitignore: true
  exclude:
    - "host_test/**/*"
    - "test_apps/**/*"
    - ".clang-format"
    - ".gitignore"

url: "https://github.com/aluiziotomazelli/time_manager"
repository: "https://github.com/aluiziotomazelli/time_manager.git"
